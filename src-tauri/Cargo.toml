[package]
name = "stroll"
version = "0.1.2"
description = "Guided, step-by-step GitHub Pull Request review desktop app"
authors = ["Daniel"]
edition = "2021"

[lib]
name = "stroll_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-http = "2.8.0"
tauri-plugin-store = "2.5.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
