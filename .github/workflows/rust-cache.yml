name: Warm Rust cache

# GitHub Actions caches are scoped to the ref that saved them. A run can only
# restore caches from its own ref or from the default branch. Release runs are
# triggered by `v*` tags, so each tag is a brand-new ref and can never see the
# cache saved by a previous tag. This workflow builds on `main` so release tag
# runs have a default-branch cache to restore from.
#
# Keep the toolchain, rust-cache `shared-key`, build args and env in sync with
# `release.yml` so the cache key and cargo fingerprints match exactly.

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'src-tauri/build.rs'
      - '.github/workflows/rust-cache.yml'
  schedule:
    # Weekly: GitHub evicts caches unused for 7 days, and `stable` rustc
    # releases change the cache key.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.platform }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Same `tauri build` invocation as tauri-action (same profile, features
      # and target), minus bundling/signing, so dependency artifacts are reused.
      - name: Build Rust dependencies
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: bun run tauri build --no-bundle ${{ matrix.args }}
