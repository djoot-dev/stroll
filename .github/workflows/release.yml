name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          EXPECTED_TAG="v${VERSION}"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            if [ "$TAG" != "$EXPECTED_TAG" ]; then
              echo "::error::Git tag '$TAG' does not match src-tauri/tauri.conf.json version '$VERSION' (expected '$EXPECTED_TAG')."
              exit 1
            fi
          else
            TAG="$EXPECTED_TAG"
          fi

          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.draft == true and .tag_name == \"${TAG}\") | .id" \
            | head -n 1)

          if [ -z "$RELEASE_ID" ]; then
            BODY=$(cat <<'EOF'
          See the assets below to download and install Stroll.

          > **macOS note:** This build is ad-hoc signed (not notarized with an Apple Developer certificate). If macOS Gatekeeper blocks the app on first launch, run `xattr -cr /Applications/Stroll.app` in Terminal or allow it in **System Settings → Privacy & Security**.
          EOF
          )
            RELEASE_ID=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="${GITHUB_SHA}" \
              -f name="Stroll ${TAG}" \
              -f body="$BODY" \
              -F draft=true \
              -F prerelease=false \
              --jq '.id')
            echo "Created draft release $RELEASE_ID for $TAG"
          else
            echo "Reusing existing draft release $RELEASE_ID for $TAG"
          fi

          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: ${{ matrix.platform }}
          # Restore the cache warmed on `main` by rust-cache.yml. Don't save from
          # tag runs: tag-scoped caches are invisible to every other tag and
          # only eat into the repo's 10 GB cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload Tauri release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Ad-hoc sign macOS bundles by default so codesign verification passes on Apple Silicon.
          # Override with a Developer ID identity secret if you add Apple signing & notarization:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          # Optional macOS Developer ID signing & notarization secrets (uncomment once configured):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
          retryAttempts: 2

      - name: Verify macOS app signature
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Stroll.app"
          codesign -dvvv \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Stroll.app"
